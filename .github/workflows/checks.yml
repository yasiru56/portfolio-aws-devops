name: PR checks

# WHEN to run: on every Pull Request into main
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: does the website still build?
  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the website
        run: npm run build
        env:
          GENERATE_SOURCEMAP: false

  # Job 2: is the Terraform code tidy and valid?
  terraform:
    name: Check Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Download provider (no AWS login)
        run: terraform init -backend=false

      - name: Check the code is valid
        run: terraform validate